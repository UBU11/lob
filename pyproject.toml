[project]
name = "lob"
version = "0.1.0"
description = "Optimal Trade Execution in a Limit Order Book via Distributional Rainbow DQN"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.4.0",
    "numpy>=2.0.0",
    "torch>=2.15.0",
    "matplotlib>=3.10.0",
    "scipy>=1.15.0",
    "pytest>=8.0.0",
]

[project.urls]
Repository = "https://github.com/UBU11/lob"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["lob_rainbow_execution/tests", "tests"]
